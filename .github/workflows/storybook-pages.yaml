name: Storybook Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/storybook-pages.yaml'
      - '.storybook/**'
      - 'src/app/design-system/**'
      - 'src/stories/**'
      - 'tools/storybook-agent/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tailwind.config.js'
      - 'tsconfig*.json'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: storybook-pages
  cancel-in-progress: true

env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_GITHUB_AUTH_TOKEN }}
  NPM_FONTAWESOME_AUTH_TOKEN: ${{ secrets.NPM_FONTAWESOME_AUTH_TOKEN }}
  STORYBOOK_BASE_URL: ${{ vars.STORYBOOK_BASE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}

jobs:
  build:
    name: Build Storybook and Agent Manifest
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@ncle-edu'

      - name: Configure FontAwesome registry
        run: |
          {
            echo '@ncle-edu:registry=https://npm.pkg.github.com/'
            printf '//npm.pkg.github.com/:_authToken=%s\n' "$NODE_AUTH_TOKEN"
            echo '@fortawesome:registry=https://npm.fontawesome.com/'
            printf '//npm.fontawesome.com/:_authToken=%s\n' "$NPM_FONTAWESOME_AUTH_TOKEN"
          } >> "$NPM_CONFIG_USERCONFIG"

      - name: Verify private registry auth
        run: |
          npm view @fortawesome/pro-solid-svg-icons version --registry=https://npm.fontawesome.com/ >/dev/null

      - name: Install dependencies
        run: npm ci

      - name: Prepare Storybook environment
        run: |
          cat > src/environments/environment.ts <<'EOF'
          export const environment = {
            production: false,
            MOCK_ENABLED: true,
            SENTRY_DSN: '',
            FONTAWESOME_NPM_AUTH_TOKEN: '',
            BE_API_BASE_URL: 'http://localhost:3001/api',
            AUTH_API_BASE_URL: 'http://localhost:3002/api',
            ENVIRONMENT_NAME: 'local',
            SMS_RECHARGE_URL: '',
            SOCKET_BASE_URL: 'ws://localhost:4000',
            MICROSOFT_TENANT_ID: '',
            MICROSOFT_AUTHORITY: 'https://login.microsoftonline.com/',
            MICROSOFT_APPLICATION_CLIENT_ID: '',
            FE_BASE_URL: 'http://localhost:8100',
            PLAUSIBLE_SCRIPT_URL: '',
            COMET_REGION: 'in',
            COMET_APP_ID: '',
            COMET_AUTH_KEY: '',
            APP_ID: 'dev.ncle.hessa.app',
            APP_NAME: 'nx Storybook',
          };
          EOF

      - name: Build Storybook
        run: npm run build-storybook

      - name: Generate agent manifest beside Storybook
        run: npm run storybook:agent-manifest:static

      - name: Validate generated agent artifacts
        run: npm run storybook:agent-validate -- --source storybook-static/index.json --base-url "$STORYBOOK_BASE_URL" --out tmp/storybook-agent-static

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: storybook-static

  deploy:
    name: Deploy Storybook to GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
