name: Replace Translation Keys in Codebase

on:
  workflow_dispatch:

jobs:
  replace-keys:
    name: Replace translation keys and create PR
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: generate_token
        uses: tibdex/github-app-token@v1
        with:
          app_id: ${{ secrets.GH_ACTIONS_APP_ID }}
          private_key: ${{ secrets.GH_ACTIONS_PRIVATE_KEY }}

      - name: Checkout frontend repository
        uses: actions/checkout@v4
        with:
          token: ${{ steps.generate_token.outputs.token }}
          fetch-depth: 0
          ref: sprint/stable
          path: hessa-fe

      - name: Clone backend repository
        run: |
          git clone --branch sprint/stable \
            https://x-access-token:${{ steps.generate_token.outputs.token }}@github.com/ncle-edu/hessa-be.git \
            hessa-be

      - name: Clone auth repository
        run: |
          git clone --branch sprint/stable \
            https://x-access-token:${{ steps.generate_token.outputs.token }}@github.com/ncle-edu/hessa-auth.git \
            hessa-auth

      - name: Clone socket repository
        run: |
          git clone --branch sprint/stable \
            https://x-access-token:${{ steps.generate_token.outputs.token }}@github.com/ncle-edu/hessa-socket.git \
            hessa-socket

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"

      - name: Install dependencies
        env:
          NPM_FONTAWESOME_AUTH_TOKEN: ${{ secrets.NPM_FONTAWESOME_AUTH_TOKEN }}
        working-directory: hessa-fe
        run: npm install googleapis glob

      - name: Create service account credentials file
        working-directory: hessa-fe
        run: |
          mkdir -p credentials
          echo "${{ secrets.I18N_GOOGLE_SERVICE_ACCOUNT_JSON_BASE64 }}" > credentials/google-service-account.json.base64
          xxd -r -p credentials/google-service-account.json.base64 > credentials/google-service-account.json

      - name: Replace translation keys in frontend
        env:
          I18N_GOOGLE_SHEET_ID: ${{ secrets.I18N_GOOGLE_SHEET_ID }}
        working-directory: hessa-fe
        run: |
          npx tsx scripts/translations/replace-translation-keys.ts --skip-delete

      - name: Replace translation keys in backend
        env:
          I18N_GOOGLE_SHEET_ID: ${{ secrets.I18N_GOOGLE_SHEET_ID }}
        working-directory: hessa-fe
        run: |
          npx tsx scripts/translations/replace-translation-keys.ts --target ${{ github.workspace }}/hessa-be --skip-delete

      - name: Replace translation keys in auth
        env:
          I18N_GOOGLE_SHEET_ID: ${{ secrets.I18N_GOOGLE_SHEET_ID }}
        working-directory: hessa-fe
        run: |
          npx tsx scripts/translations/replace-translation-keys.ts --target ${{ github.workspace }}/hessa-auth --skip-delete

      - name: Replace translation keys in socket
        env:
          I18N_GOOGLE_SHEET_ID: ${{ secrets.I18N_GOOGLE_SHEET_ID }}
        working-directory: hessa-fe
        run: |
          npx tsx scripts/translations/replace-translation-keys.ts --target ${{ github.workspace }}/hessa-socket

      - name: Create Pull Requests for Frontend
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        working-directory: hessa-fe
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          # Check for key replacement changes (source files, excluding i18n and mockServiceWorker)
          git add src/ ':!src/assets/i18n/' ':!src/mockServiceWorker.js'
          if git diff --cached --quiet; then
            echo "No frontend key replacement changes"
            exit 0
          fi

          # Create a unique branch name with timestamp
          BRANCH_NAME="chore/replace-translation-keys-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          git commit -m "chore: replace translation keys in codebase"
          git push origin "$BRANCH_NAME"

          # Create PR targeting sprint/stable branch
          gh pr create \
            --title "chore: replace translation keys in codebase" \
            --body "$(cat <<'EOF'
          ## Summary
          - Automated replacement of translation keys in the codebase

          ## Generated by
          GitHub Actions workflow: `translations-replace-keys.yaml`

          🤖 Generated with GitHub Actions
          EOF
          )" \
            --base sprint/stable \
            --head "$BRANCH_NAME"

          echo "✅ Frontend PR for sprint/stable created"

          # Create PR targeting development branch
          gh pr create \
            --title "chore: replace translation keys in codebase" \
            --body "$(cat <<'EOF'
          ## Summary
          - Automated replacement of translation keys in the codebase

          ## Generated by
          GitHub Actions workflow: `translations-replace-keys.yaml`

          🤖 Generated with GitHub Actions
          EOF
          )" \
            --base development \
            --head "$BRANCH_NAME"

          echo "✅ Frontend PR for development created"

      - name: Create Pull Requests for Backend
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        working-directory: hessa-be
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          # Check for key replacement changes
          git add .
          if git diff --cached --quiet; then
            echo "No backend key replacement changes"
            exit 0
          fi

          # Create a unique branch name with timestamp
          BRANCH_NAME="chore/replace-translation-keys-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          git commit -m "chore: replace translation keys in codebase"
          git push origin "$BRANCH_NAME"

          # Create PR targeting sprint/stable branch
          gh pr create \
            --title "chore: replace translation keys in codebase" \
            --body "$(cat <<'EOF'
          ## Summary
          - Automated replacement of translation keys in the codebase

          ## Generated by
          GitHub Actions workflow: `translations-replace-keys.yaml` (hessa-fe)

          🤖 Generated with GitHub Actions
          EOF
          )" \
            --base sprint/stable \
            --head "$BRANCH_NAME"

          echo "✅ Backend PR for sprint/stable created"

          # Create PR targeting development branch
          gh pr create \
            --title "chore: replace translation keys in codebase" \
            --body "$(cat <<'EOF'
          ## Summary
          - Automated replacement of translation keys in the codebase

          ## Generated by
          GitHub Actions workflow: `translations-replace-keys.yaml` (hessa-fe)

          🤖 Generated with GitHub Actions
          EOF
          )" \
            --base development \
            --head "$BRANCH_NAME"

          echo "✅ Backend PR for development created"

      - name: Create Pull Requests for Auth
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        working-directory: hessa-auth
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          # Check for key replacement changes
          git add .
          if git diff --cached --quiet; then
            echo "No auth key replacement changes"
            exit 0
          fi

          # Create a unique branch name with timestamp
          BRANCH_NAME="chore/replace-translation-keys-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          git commit -m "chore: replace translation keys in codebase"
          git push origin "$BRANCH_NAME"

          # Create PR targeting sprint/stable branch
          gh pr create \
            --title "chore: replace translation keys in codebase" \
            --body "$(cat <<'EOF'
          ## Summary
          - Automated replacement of translation keys in the codebase

          ## Generated by
          GitHub Actions workflow: `translations-replace-keys.yaml` (hessa-fe)

          🤖 Generated with GitHub Actions
          EOF
          )" \
            --base sprint/stable \
            --head "$BRANCH_NAME"

          echo "✅ Auth PR for sprint/stable created"

          # Create PR targeting development branch
          gh pr create \
            --title "chore: replace translation keys in codebase" \
            --body "$(cat <<'EOF'
          ## Summary
          - Automated replacement of translation keys in the codebase

          ## Generated by
          GitHub Actions workflow: `translations-replace-keys.yaml` (hessa-fe)

          🤖 Generated with GitHub Actions
          EOF
          )" \
            --base development \
            --head "$BRANCH_NAME"

          echo "✅ Auth PR for development created"

      - name: Create Pull Requests for Socket
        env:
          GH_TOKEN: ${{ steps.generate_token.outputs.token }}
        working-directory: hessa-socket
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"

          # Check for key replacement changes
          git add .
          if git diff --cached --quiet; then
            echo "No socket key replacement changes"
            exit 0
          fi

          # Create a unique branch name with timestamp
          BRANCH_NAME="chore/replace-translation-keys-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH_NAME"
          git commit -m "chore: replace translation keys in codebase"
          git push origin "$BRANCH_NAME"

          # Create PR targeting sprint/stable branch
          gh pr create \
            --title "chore: replace translation keys in codebase" \
            --body "$(cat <<'EOF'
          ## Summary
          - Automated replacement of translation keys in the codebase

          ## Generated by
          GitHub Actions workflow: `translations-replace-keys.yaml` (hessa-fe)

          🤖 Generated with GitHub Actions
          EOF
          )" \
            --base sprint/stable \
            --head "$BRANCH_NAME"

          echo "✅ Socket PR for sprint/stable created"

          # Create PR targeting development branch
          gh pr create \
            --title "chore: replace translation keys in codebase" \
            --body "$(cat <<'EOF'
          ## Summary
          - Automated replacement of translation keys in the codebase

          ## Generated by
          GitHub Actions workflow: `translations-replace-keys.yaml` (hessa-fe)

          🤖 Generated with GitHub Actions
          EOF
          )" \
            --base development \
            --head "$BRANCH_NAME"

          echo "✅ Socket PR for development created"

      - name: Cleanup
        if: always()
        run: |
          rm -rf hessa-fe/credentials
          rm -rf hessa-be
          rm -rf hessa-auth
          rm -rf hessa-socket
