<!doctype html>
<html lang="en" translate="no">
  <head>
    <meta charset="utf-8" />
    <title>nx</title>

    <base href="/" />

    <meta name="google" content="notranslate" />
    <meta name="color-scheme" content="light dark" />
    <!-- Consolidated single viewport meta to prevent iOS zoom quirks; removed duplicates -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />

    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favico/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favico/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favico/favicon-16x16.png"
    />
    <link rel="manifest" href="/assets/favico/site.webmanifest" />
    <link
      rel="mask-icon"
      href="/assets/favico/safari-pinned-tab.svg"
      color="#5bbad5"
    />
    <link rel="shortcut icon" href="/assets/favico/favicon.ico" />
    <meta name="msapplication-TileColor" content="#da532c" />
    <meta
      name="msapplication-config"
      content="/assets/favico/browserconfig.xml"
    />
    <meta name="theme-color" content="#ffffff" />

    <!-- add to homescreen for ios -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
  </head>
  <body style="display: block">
    <!-- basic html and CSS splash screen for when the browser is still fetching App Js -->
    <div id="initial-splash" class="splash-screen">
      <style>
        html:lang(ar) .progress-bar {
          direction: rtl;
        }

        html:lang(ar) .progress-bar-value {
          float: right;
        }

        .splash-screen {
          position: fixed;
          top: 0;
          left: 0;
          width: 100%;
          height: 100vh;
          background-color: #f8f9fa; /* bg-surface-primary fallback */
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 9999;
          transition: opacity 0.3s ease-out;
        }

        .splash-screen.fade-out {
          opacity: 0;
          pointer-events: none;
        }

        .main-content {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 2rem;
        }

        .camel-container {
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .camel-mascot {
          width: 180px;
          height: auto;
        }

        .loading-section {
          position: absolute;
          bottom: 3rem;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          gap: 0.75rem;
        }

        .nx-logo-container {
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .nx-logo {
          width: 100px;
          height: auto;
          max-width: 100%;
        }

        .progress-bar {
          width: 100%;
          height: 4px;
          background-color: #e5e7eb;
          border-radius: 2px;
          overflow: hidden;
        }

        .progress-bar-value {
          height: 100%;
          background-color: #fbbf24;
          border-radius: 2px;
          animation: loading-progress 2s ease-in-out infinite;
        }

        @keyframes loading-progress {
          0% {
            width: 0%;
            transform: translateX(0);
          }
          50% {
            width: 70%;
          }
          100% {
            width: 100%;
          }
        }

        /* Responsive styles matching Tailwind breakpoints exactly */

        /* Default (base) - matches no prefix in Tailwind */
        .camel-mascot {
          width: 180px; /* w-[180px] */
        }

        .nx-logo {
          width: 100px; /* w-[100px] */
        }

        .main-content {
          gap: 2rem; /* gap-8 */
        }

        .loading-section {
          bottom: 3rem; /* bottom-12 */
        }

        /* sm: (min-width: 640px) */
        @media screen and (min-width: 640px) {
          .camel-mascot {
            width: 120px; /* sm:w-[120px] */
          }
          .nx-logo {
            width: 60px; /* sm:w-[60px] */
          }
          .main-content {
            gap: 1rem; /* sm:gap-4 */
          }
          .loading-section {
            bottom: 2rem; /* sm:bottom-8 */
          }
        }

        /* md: (min-width: 768px) */
        @media screen and (min-width: 768px) {
          .camel-mascot {
            width: 180px; /* md:w-[180px] */
          }
          .nx-logo {
            width: 120px; /* md:w-[120px] */
          }
          .main-content {
            gap: 1.5rem; /* md:gap-6 */
          }
        }

        /* lg: (min-width: 1024px) */
        @media screen and (min-width: 1024px) {
          .camel-mascot {
            width: 268px; /* lg:w-[268px] */
          }
        }

        /* Mobile-only NX logo */
        .mobile-top-logo {
          display: block;
          margin-bottom: 50px; /* ≈50px above camel */
        }
        @media (min-width: 640px) {
          .mobile-top-logo {
            display: none;
          }
        }

        /* Hide loading section (bottom logo + bar) on mobile, keep ≥ sm */
        .loading-section {
          display: none;
        }
        @media (min-width: 640px) {
          .loading-section {
            display: flex;
          }
        }
      </style>

      <div class="main-content">
        <!-- Mobile-only NX logo -->
        <div class="mobile-top-logo">
          <img
            id="nx-logo-img-mobile"
            src="/assets/logos/nx-yellow-beta-en.svg"
            alt="NX Logo"
            class="nx-logo"
            fetchpriority="high"
          />
        </div>

        <!-- Camel character -->
        <div class="camel-container">
          <img
            src="/assets/logos/camel-mascot.svg"
            alt="NX Camel"
            class="camel-mascot"
            fetchpriority="high"
          />
        </div>
      </div>

      <!-- Bottom (desktop / tablet only) -->
      <div class="loading-section">
        <!-- NX Logo -->
        <div class="nx-logo-container">
          <img
            id="nx-logo-img"
            src="/assets/logos/nx-yellow-beta-en.svg"
            alt="NX Logo"
            class="nx-logo"
            fetchpriority="high"
          />
        </div>
        <div class="progress-bar">
          <div class="progress-bar-value"></div>
        </div>
      </div>
    </div>

    <app-root></app-root>
  </body>
  <script>
    // Immediately invoked function to set up splash screen
    (function () {
      var lang = localStorage.getItem("lang") || "en";
      var logoImg = document.getElementById("nx-logo-img");
      var mobileLogo = document.getElementById("nx-logo-img-mobile");

      // Set the correct logo based on language
      if (lang === "ar") {
        logoImg.src = "/assets/logos/nx-yellow-beta-ar.svg";
        if (mobileLogo) {
          mobileLogo.src = "/assets/logos/nx-yellow-beta-ar.svg";
        }
      } else {
        logoImg.src = "/assets/logos/nx-yellow-beta-en.svg";
        if (mobileLogo) {
          mobileLogo.src = "/assets/logos/nx-yellow-beta-en.svg";
        }
      }

      // Function to hide splash screen
      function hideSplash() {
        var splash = document.getElementById("initial-splash");
        if (splash) {
          splash.classList.add("fade-out");
          setTimeout(function () {
            splash.style.display = "none";
          }, 300);
        }
      }

      // Hide splash when Angular app is ready
      function checkForAngularApp() {
        var appRoot = document.querySelector("app-root");
        if (appRoot && appRoot.children.length > 0) {
          hideSplash();
        } else {
          setTimeout(checkForAngularApp, 100);
        }
      }

      // Start checking for Angular app after DOM is loaded
      if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", function () {
          setTimeout(checkForAngularApp, 100);
        });
      } else {
        setTimeout(checkForAngularApp, 100);
      }

      // Fallback: hide splash after maximum time (10 seconds)
      setTimeout(hideSplash, 10000);
    })();
  </script>
</html>
