<ng-container *transloco="let t">
  <form [formGroup]="form">
    <div class="grid grid-cols-1 gap-8 gap-y-4 self-stretch md:grid-cols-2">
      @for (control of formConfig(); track control.formControlName) {
        <div class="flex-1">
          <app-form-control-generator
            [control]="control"
          ></app-form-control-generator>
        </div>
      }
    </div>
  </form>
</ng-container>
