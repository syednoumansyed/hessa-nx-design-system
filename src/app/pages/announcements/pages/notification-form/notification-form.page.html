<ion-content class="ds-page-content" *transloco="let t;">
  <div class="ps-4 md:p-5">
    <app-hes-stepper [selectedIndex]="step()" [orientation]="'vertical'">
      <cdk-step
        [completed]="form.controls.content.valid && form.controls.title.valid"
        [label]="t('announcements.notification_details.title')"
      >
        <form [formGroup]="form">
          <div class="grid grid-cols-1 gap-8 gap-y-4 self-stretch">
            @for (control of config(); track control.formControlName) {
            <div class="flex-1">
              <app-form-control-generator
                [control]="control"
              ></app-form-control-generator>
              <div
                class="mt-1 flex justify-end text-sm text-gray-500"
                [ngClass]="{'text-red-500': control.charCount > control.charLimit}"
              >
                <span>{{ control.charCount }}/{{ control.charLimit }}</span>
              </div>
            </div>
            }
          </div>
        </form>
      </cdk-step>
      <cdk-step
        [completed]="form.controls.targetForm.valid"
        [label]="t('announcements.target.title')"
      >
        <app-post-target-form
          [form]="form.controls.targetForm"
          [announcementType]="'notification'"
        ></app-post-target-form>
      </cdk-step>
    </app-hes-stepper>
    <div class="flex w-full flex-col-reverse gap-3 md:flex-row md:justify-end">
      <ion-button
        hesBtn
        hesColor="secondary"
        class="mt-4 w-full md:w-auto"
        (click)="onCancelClick()"
      >
        {{t('global.cancel.btn')}}
      </ion-button>
      <ion-button
        hesBtn
        hesColor="primary"
        class="mt-4 md:w-fit"
        (click)="onSubmit()"
        [disabled]="form.invalid || !form.dirty"
      >
        {{t('announcements.review_notification.btn')}}
      </ion-button>
    </div>
  </div>
</ion-content>
