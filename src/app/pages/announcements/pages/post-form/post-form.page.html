<ion-content class="ds-page-content" *transloco="let t;">
  <div class="px-5 pt-4 md:p-5">
    <app-hes-stepper [selectedIndex]="step()" [orientation]="'vertical'">
      <cdk-step
        [completed]="form.controls.postDetailForm.controls.title.valid && form.controls.postDetailForm.controls.content.valid"
        [label]="t('announcements.post_details.title')"
      >
        <app-post-detail-form
          [form]="form.controls.postDetailForm"
        ></app-post-detail-form>
      </cdk-step>
      <cdk-step
        [completed]="form.controls.targetForm.valid"
        [label]="t('announcements.target.title')"
      >
        <app-post-target-form
          [form]="form.controls.targetForm"
          [announcementType]="'post'"
        ></app-post-target-form>
      </cdk-step>
    </app-hes-stepper>
    <div class="flex w-full flex-col-reverse gap-3 md:flex-row md:justify-end">
      <ion-button
        hesBtn
        hesColor="secondary"
        class="mt-4 w-full md:w-auto"
        (click)="onCancelClick()"
      >
        {{t('global.cancel.btn')}}
      </ion-button>
      <ion-button
        hesBtn
        hesColor="primary"
        class="mt-4 w-full md:w-auto"
        (click)="onSubmit()"
        [disabled]="form.invalid || !form.dirty"
      >
        {{t('announcements.review_post.btn')}}
      </ion-button>
    </div>
  </div>
</ion-content>
