<div *transloco="let t" class="p-4">
  <div class="flex items-center justify-evenly overflow-hidden">
    <div
      class="max-md:px-5 w-full items-stretch gap-6 rounded-lg bg-white px-2 py-2 font-semibold md:flex md:w-[35rem] md:max-w-[35rem] md:flex-col md:px-16 md:py-12 md:shadow-[0_0_80px_0_rgba(0,0,0,0.05)]"
    >
      <div class="flex flex-col items-stretch gap-6">
        <div class="flex flex-col items-stretch gap-16">
          <header
            class="whitespace-wrap flex flex-col items-center justify-center gap-4 text-center text-3xl leading-7 text-gray-800"
          >
            <div
              class="hidden h-[7.2rem] w-[7.2rem] items-center justify-center rounded-full bg-[#383C57]/[0.06] md:flex"
            >
              <div
                class="flex h-[5.6rem] w-[5.6rem] items-center justify-center rounded-full bg-[#383C57]/[0.1]"
              >
                @if (currentStep() !== 'changePassword') {
                <svg
                  xmlns="http://www.w3.org/2000/svg"
                  width="60"
                  height="60"
                  viewBox="0 0 60 60"
                  fill="none"
                >
                  <path
                    d="M54.275 16.3255L50.725 12.8005L54.275 9.27546C54.7458 8.8047 55.0102 8.16622 55.0102 7.50046C55.0102 6.83471 54.7458 6.19622 54.275 5.72546C53.8042 5.2547 53.1658 4.99023 52.5 4.99023C51.8342 4.99023 51.1958 5.2547 50.725 5.72546L24.375 32.0755C21.7901 30.3701 18.6642 29.6849 15.6029 30.1527C12.5417 30.6205 9.76304 32.208 7.80546 34.6076C5.84788 37.0072 4.85072 40.048 5.00719 43.1408C5.16366 46.2337 6.46262 49.1583 8.65239 51.3481C10.8422 53.5378 13.7668 54.8368 16.8596 54.9933C19.9525 55.1497 22.9933 54.1526 25.3929 52.195C27.7925 50.2374 29.38 47.4588 29.8478 44.3975C30.3156 41.3363 29.6304 38.2104 27.925 35.6255L40.125 23.4005L43.65 26.9505C43.8836 27.1822 44.1606 27.3655 44.4652 27.4899C44.7698 27.6143 45.096 27.6774 45.425 27.6755C45.754 27.6774 46.0802 27.6143 46.3848 27.4899C46.6894 27.3655 46.9664 27.1822 47.2 26.9505C47.4343 26.7181 47.6203 26.4416 47.7472 26.1369C47.8742 25.8323 47.9395 25.5055 47.9395 25.1755C47.9395 24.8454 47.8742 24.5187 47.7472 24.214C47.6203 23.9094 47.4343 23.6329 47.2 23.4005L43.65 20.0005L47.2 16.4505L50.725 20.0005C50.9586 20.2322 51.2356 20.4155 51.5402 20.5399C51.8448 20.6643 52.171 20.7274 52.5 20.7255C52.829 20.7274 53.1552 20.6643 53.4598 20.5399C53.7644 20.4155 54.0414 20.2322 54.275 20.0005C54.5288 19.7664 54.7313 19.4822 54.8698 19.166C55.0083 18.8497 55.0798 18.5082 55.0798 18.163C55.0798 17.8177 55.0083 17.4762 54.8698 17.1599C54.7313 16.8437 54.5288 16.5596 54.275 16.3255ZM17.5 50.0005C16.0166 50.0005 14.5666 49.5606 13.3332 48.7365C12.0999 47.9124 11.1386 46.741 10.5709 45.3706C10.0032 44.0001 9.85472 42.4921 10.1441 41.0373C10.4335 39.5824 11.1478 38.2461 12.1967 37.1972C13.2456 36.1483 14.582 35.434 16.0368 35.1446C17.4917 34.8552 18.9997 35.0037 20.3701 35.5714C21.7406 36.139 22.9119 37.1003 23.736 38.3337C24.5601 39.5671 25 41.0171 25 42.5005C25 44.4896 24.2098 46.3972 22.8033 47.8038C21.3968 49.2103 19.4891 50.0005 17.5 50.0005Z"
                    fill="#383C57"
                  />
                </svg>
                } @else {
                <svg
                  width="57"
                  height="56"
                  viewBox="0 0 57 56"
                  fill="none"
                  xmlns="http://www.w3.org/2000/svg"
                >
                  <path
                    d="M42.5 18.6673H47.1667C47.7855 18.6673 48.379 18.9132 48.8166 19.3507C49.2542 19.7883 49.5 20.3818 49.5 21.0007V49.0006C49.5 49.6195 49.2542 50.213 48.8166 50.6506C48.379 51.0882 47.7855 51.334 47.1667 51.334H9.83333C9.21449 51.334 8.621 51.0882 8.18342 50.6506C7.74583 50.213 7.5 49.6195 7.5 49.0006V21.0007C7.5 20.3818 7.74583 19.7883 8.18342 19.3507C8.621 18.9132 9.21449 18.6673 9.83333 18.6673H14.5V16.334C14.5 12.621 15.975 9.06 18.6005 6.43449C21.226 3.80898 24.787 2.33398 28.5 2.33398C32.213 2.33398 35.774 3.80898 38.3995 6.43449C41.025 9.06 42.5 12.621 42.5 16.334V18.6673ZM37.8333 18.6673V16.334C37.8333 13.8586 36.85 11.4847 35.0997 9.73432C33.3493 7.98398 30.9754 7.00065 28.5 7.00065C26.0246 7.00065 23.6507 7.98398 21.9003 9.73432C20.15 11.4847 19.1667 13.8586 19.1667 16.334V18.6673H37.8333ZM26.1667 32.6673V37.334H30.8333V32.6673H26.1667ZM16.8333 32.6673V37.334H21.5V32.6673H16.8333ZM35.5 32.6673V37.334H40.1667V32.6673H35.5Z"
                    fill="#383C57"
                  />
                </svg>

                }
              </div>
            </div>
            <div class="text-center text-[28px] font-medium text-neutral-900">
              {{t('login.forgot_password.txt')}}
            </div>
            <div
              class="text-center text-base font-normal leading-snug text-neutral-600"
            >
              {{t('login.reset_password_with_id.txt')}}
            </div>
          </header>

          @switch (currentStep()) { @case ('nationalId') {
          <app-hes-input
            [type]="'text'"
            [label]="t('global.national_id.label')"
            [placeholder]="t('global.enter_national_id.placeholder')"
            [required]="true"
            fill="solid"
            [formControl]="nationalIdFormControl"
            [errorText]="nationalIdFormControlErr() ?? undefined"
            [maxLength]="18"
            [inputMode]="'numeric'"
            [isOnlyNumaric]="true"
          ></app-hes-input>
          } @case ('contactNumber') {
          <app-hes-input
            [type]="'tel'"
            [label]="t('global.contact_number.label')"
            [placeholder]="'XXX XXXXXXX'"
            [required]="true"
            fill="solid"
            [formControl]="contactNumberFormControl"
            [errorText]="contactNumberFormControlErr() ?? undefined"
            [maxLength]="9"
          ></app-hes-input>
          } @case ('changePassword') {
          <form [formGroup]="form" class="flex flex-col gap-4">
            <app-hes-input
              [type]="'password'"
              [label]="t('global.password.label')"
              [placeholder]="t('global.enter_password.placeholder')"
              [required]="true"
              fill="solid"
              formControlName="password"
              [errorText]="passwordErr() ?? undefined"
            ></app-hes-input>

            <app-hes-input
              [type]="'password'"
              [label]="t('login.confirm_password.label')"
              [placeholder]="t('login.re_type_password.placeholder')"
              [required]="true"
              fill="solid"
              formControlName="confirmPassword"
              [errorText]="confirmPasswordErr() ?? undefined"
            ></app-hes-input>
          </form>
          } }
        </div>
        <ion-button
          hesBtn
          type="submit"
          (click)="moveToNextStep()"
          [disabled]="isSubmitDisabled()"
        >
          {{t(submitButtonText())}}
        </ion-button>
      </div>
    </div>
  </div>
</div>
