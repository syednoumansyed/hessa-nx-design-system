<ng-container *transloco="let t">
  @if (isView()) {
    <div class="grid h-full w-full grid-cols-1 gap-1 md:grid-cols-2 md:gap-7">
      @for (item of viewReportCard(); track $index) {
        <div
          class="flex flex-col gap-1"
          [ngClass]="{ 'md:col-span-2': $index === 0 }"
        >
          <span class="text-xs font-semibold text-[#141519] md:text-base">{{
            item.title
          }}</span>
          <span
            class="py-3 text-sm font-normal text-[#344054] md:pt-3 md:text-base"
            >{{ item.value }}</span
          >
        </div>
      }
    </div>
  } @else {
    <form [formGroup]="form()" class="grid w-full gap-4">
      <div
        class="grid w-full grid-cols-1 gap-8 gap-y-7 self-stretch md:grid-cols-2"
      >
        @for (control of formConfig(); track $index) {
          <div class="w-full" [ngClass]="{ 'md:col-span-2': $index === 0 }">
            <app-form-control-generator
              [control]="control"
            ></app-form-control-generator>
          </div>
        }
      </div>
    </form>
  }
</ng-container>
