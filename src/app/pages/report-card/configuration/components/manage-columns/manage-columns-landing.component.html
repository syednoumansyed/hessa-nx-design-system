<div
  *transloco="let t"
  class="mb-2 flex items-center justify-between text-base font-semibold"
>
  <div>{{ t("grade_management.add_column.title") }}</div>
  @if (!isView() || !reportCard()?.columns) {
    <ion-button (click)="onAddNewColumn()" [hesSize]="'md'">
      <fa-icon [icon]="addIcon"></fa-icon>
    </ion-button>
  }
</div>
@if (hasColumns()) {
  <app-report-card-column-list
    [reportCard]="reportCard()!"
    [isEdit]="isEdit()"
  ></app-report-card-column-list>
} @else {
  <div
    class="flex min-h-[40vh] w-full flex-col items-center justify-center gap-2 rounded-md bg-[#F8F8F8]"
    *transloco="let t"
  >
    <div class="text-base text-[#6B6F80]">
      {{ t("grade_management.no_comumn_added.txt") }}
    </div>
    <ion-button (click)="onAddNewColumn()" class="hes-btn--primary">
      <fa-icon [icon]="addIcon"></fa-icon>
      <span class="ms-1 md:inline-block">
        {{ t("grade_management.add_column.btn") }}
      </span>
    </ion-button>
  </div>
}
