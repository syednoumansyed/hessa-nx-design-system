<ng-container *transloco="let t">
  <div class="Modal m-6 flex flex-col gap-4">
    <div
      class="flex justify-between border-b-2 border-[#EAECF0] pb-5 font-semibold text-[#101828]"
    >
      <div class="text-2xl">
        {{ t("global.view_details.btn") }}
      </div>
      <fa-icon
        class="mt-1 cursor-pointer"
        [icon]="faClose"
        size="xl"
        (click)="closeModal()"
      ></fa-icon>
    </div>
    @for (vm of vm() | keyvalue; track $index) {
      <div class="mt-3 flex flex-col gap-3 text-sm">
        <div class="font-normal text-[#667085]">{{ vm.key }}</div>
        <div class="font-semibold text-[#101828]">{{ vm.value }}</div>
      </div>
    }
  </div>
</ng-container>
