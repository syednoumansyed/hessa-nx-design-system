<div class="flex w-full max-w-full flex-col gap-ds-xl">
  <section class="gap-ds-2xs flex flex-col text-emphasis-mid">
    <div
      class="single-line-sm-high-emphasis text-emphasis-high"
      *ngIf="ticketTitle(); let title"
    >
      {{ title }}
    </div>
  </section>

  <form class="flex flex-col gap-ds-xl" [formGroup]="form">
    <div class="flex flex-col gap-ds-sm">
      <app-ds-textarea
        formControlName="message"
        [label]="'support.ticket.deescalate.note' | dsTranslate"
        placeholder=""
        [required]="true"
        [rows]="5"
      ></app-ds-textarea>
    </div>

    <ds-attachment-form-control
      class="w-full"
      formControlName="attachments"
      [label]="'global.attachments.label' | dsTranslate"
      [hint]="'support.ticket.attachments.upload' | dsTranslate"
      [acceptFileTypes]="attachmentAcceptTypes"
      [maxSizeInMB]="attachmentMaxSizeMb"
      [isMultiple]="true"
    ></ds-attachment-form-control>

    <section class="flex flex-col gap-ds-sm">
      @if (escalationLevelLabel(); as label) {
        <div class="content-sm-mid-emphasis text-emphasis-mid">
          {{ label }}
        </div>
      }

      @if (escalationPersonnels().length > 0) {
        <div class="flex flex-col gap-ds-sm">
          @for (
            person of escalationPersonnels();
            track trackByPerson($index, person)
          ) {
            <div class="flex items-center gap-ds-md">
              <app-ds-avatar
                [fullName]="person.name"
                [color]="person.avatarColor"
                [size]="'xl'"
                [includeBorder]="false"
              ></app-ds-avatar>
              <div class="gap-ds-2xs flex flex-col">
                <div class="single-line-sm-high-emphasis text-emphasis-high">
                  {{ person.name }}
                </div>
                @if (person.role) {
                  <div class="single-line-sm-mid-emphasis text-emphasis-mid">
                    {{ person.role }}
                  </div>
                }
              </div>
            </div>
          }
        </div>
      }
    </section>
  </form>
</div>
