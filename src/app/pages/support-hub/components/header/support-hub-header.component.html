<div class="pb-0 md:bg-surface-primary md:p-0">
  @if (!isSplitView()) {
    <div class="mb-ds-xl">
      <div class="heading-h2-high-emphasis text-emphasis-high">
        {{ "global.salam.txt" | dsTranslate }} {{ userName() }}
      </div>
      <div class="content-md-mid-emphasis mt-ds-sm text-emphasis-mid">
        {{ "support.welcome.subtitle" | dsTranslate }}
      </div>
      <div
        class="mt-ds-xl rounded-ds-xl border-4 border-stroke-black-08 bg-surface-primary"
      >
        <app-support-hub-action-list
          [items]="actionCards()"
          (itemSelected)="handleActionSelected($event)"
        ></app-support-hub-action-list>
      </div>
    </div>
  }

  <div class="flex flex-col gap-ds-md md:p-4">
    <div class="flex items-center gap-ds-sm">
      <app-search-box
        class="flex-1"
        [placeholderTxt]="searchPlaceholderKey() | dsTranslate"
        [includeAddButton]="showAddButton()"
        [manageBottomBarVisibility]="false"
        [value]="searchText()"
        (searchChange)="onSearchChange($event)"
        (addButtonClick)="onNewHelpRequestClick()"
      ></app-search-box>
    </div>
    @if (canManageTickets()) {
      <app-support-hub-filters
        [showInitiated]="showInitiated()"
        [filters]="filters()"
        [hasInitiatedTickets]="hasInitiatedTickets()"
        [hasAssignedTickets]="hasAssignedTickets()"
        (filtersChanged)="onFiltersChanged($event)"
      ></app-support-hub-filters>
    }
  </div>
</div>
