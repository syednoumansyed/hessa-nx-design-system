<div class="flex flex-col gap-ds-md py-ds-md">
  @for (item of items(); track item.id) {
    <div
      class="flex cursor-pointer items-center gap-ds-xl rounded-ds-lg px-ds-md py-ds-md transition"
      [ngClass]="{
        'border border-brand-600 bg-surface-brand-surface-light':
          selectedId() === item.id,
        'hover:bg-surface-secondary-hover': selectedId() !== item.id,
      }"
      (click)="handleItemClick(item)"
    >
      <!-- Icon -->
      <div class="flex-shrink-0">
        <app-ds-icon
          [icon]="item.icon ?? fallbackIcon"
          [size]="'2xl'"
          class="text-icon-high"
        ></app-ds-icon>
      </div>

      <!-- Text Content -->
      <div class="flex min-w-0 flex-1 flex-col gap-ds-xs">
        <p class="heading-h5-high-emphasis text-emphasis-high">
          {{ item.title }}
        </p>
        <p class="single-line-caption-mid-emphasis text-emphasis-mid">
          {{ item.description }}
        </p>
      </div>
    </div>
  }
</div>
