@if (showIconOnly()) {
  <!-- Icon-only skeleton for todo items -->
  <div class="flex flex-col gap-3">
    @for (i of [1, 2, 3]; track $index) {
      <div class="flex items-center gap-3 rounded-lg bg-white p-3">
        <ion-skeleton-text
          [animated]="true"
          class="h-[40px] w-[40px] rounded-lg"
        />
        <div class="flex flex-1 flex-col gap-2">
          <ion-skeleton-text
            [animated]="true"
            class="h-[14px] w-[70%] rounded-md"
          />
          <ion-skeleton-text
            [animated]="true"
            class="h-[12px] w-[40%] rounded-md"
          />
        </div>
      </div>
    }
  </div>
} @else {
  <!-- Full page skeleton -->
  <div class="max-h-screen bg-[var(--colors-brand-35)] px-4 py-4">
    <!-- Basic course card skeleton -->
    <div
      class="flex items-center gap-5 overflow-hidden rounded-ds-lg border-2 border-stroke-black-08 bg-surface-pastel-background-blue"
    >
      <div
        class="flex items-center justify-center bg-white/60 px-ds-sm py-ds-xl"
      >
        <ion-skeleton-text
          [animated]="true"
          class="h-[72px] w-[72px] rounded-lg"
        />
      </div>
      <div class="flex flex-1 flex-col gap-ds-sm px-ds-xl py-ds-md">
        <ion-skeleton-text
          [animated]="true"
          class="h-[20px] w-[60%] rounded-md"
        />
        <ion-skeleton-text
          [animated]="true"
          class="h-[14px] w-[30%] rounded-md"
        />
        <ion-skeleton-text
          [animated]="true"
          class="h-[8px] w-full rounded-full"
        />
        <ion-skeleton-text
          [animated]="true"
          class="h-[12px] w-[50%] rounded-md"
        />
      </div>
    </div>

    <!-- Teacher and level info skeleton -->
    <div class="flex flex-col gap-2 py-3">
      <ion-skeleton-text
        [animated]="true"
        class="h-[14px] w-[40%] rounded-md"
      />
      <div class="flex items-center gap-1">
        <ion-skeleton-text
          [animated]="true"
          class="h-[28px] w-[80px] rounded-full"
        />
        <ion-skeleton-text
          [animated]="true"
          class="h-[28px] w-[60px] rounded-full"
        />
      </div>
    </div>

    <!-- Course Detail / All topics skeleton -->
    <div class="mt-ds-xl flex flex-col gap-2">
      <ion-skeleton-text
        [animated]="true"
        class="h-[20px] w-[120px] rounded-md"
      />
      <div class="flex items-center gap-2">
        <ion-skeleton-text
          [animated]="true"
          class="h-[14px] w-[180px] rounded-md"
        />
      </div>
    </div>

    <!-- Work overview skeleton -->
    <div class="mt-6">
      <ion-skeleton-text
        [animated]="true"
        class="h-[44px] w-full rounded-[28px]"
      />
      <div class="mt-3 flex justify-center gap-ds-sm md:justify-start">
        @for (i of [1, 2, 3, 4]; track $index) {
          <ion-skeleton-text
            [animated]="true"
            class="h-[24px] w-[70px] rounded-full"
          />
        }
      </div>
    </div>

    <!-- Weekly detail skeleton -->
    <div class="mt-10 min-h-40">
      <div class="flex flex-col gap-4">
        @for (i of [1, 2, 3]; track $index) {
          <div class="rounded-ds-lg border border-stroke-black-08 bg-white p-4">
            <div class="flex items-center justify-between">
              <ion-skeleton-text
                [animated]="true"
                class="h-[18px] w-[100px] rounded-md"
              />
              <ion-skeleton-text
                [animated]="true"
                class="h-[24px] w-[24px] rounded-full"
              />
            </div>
            <div class="mt-3 flex flex-col gap-2">
              <ion-skeleton-text
                [animated]="true"
                class="h-[14px] w-[80%] rounded-md"
              />
              <ion-skeleton-text
                [animated]="true"
                class="h-[14px] w-[60%] rounded-md"
              />
            </div>
          </div>
        }
      </div>
    </div>
  </div>
}
