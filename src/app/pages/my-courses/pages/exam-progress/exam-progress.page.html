<ion-content class="ds-page-content" *transloco="let t;">
  <div class="hes-card flex h-full w-full flex-col items-start justify-start">
    <div class="mb-5 text-2xl text-gray-900">{{examDetails()?.title}}</div>
    <div
      class="hes-card flex h-full w-full flex-col items-start justify-start p-0"
    >
      <app-listing-header
        class="mb-3"
        [title]="t('global.student_list.title')"
        [loading]="isLoading()"
        [filterControls]="headerFilterConfig()"
        (onFiltersChange)="onFiltersChange($event)"
      ></app-listing-header>
      <app-hes-table
        [columns]="columns()"
        [rowData]="examProgressTableData()"
        [hideColumnsSelection]="true"
        [hideEntriesSelection]="true"
        [noRowsOverlayComponentParams]="noRowsOverlayComponentParams()"
        [loading]="isLoading()"
      ></app-hes-table>
    </div>
  </div>
</ion-content>
