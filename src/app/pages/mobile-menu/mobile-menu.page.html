<ion-content class="ds-page-content" *transloco="let t;">
  <div class="flex flex-col items-center justify-start">
    @if (isGuardianUser()) {
    <app-student-selection class="mb-3 w-full"></app-student-selection>
    }
    <app-school-scope-selection-popover class="mb-3 w-full">
      <app-school-scope-selection-button #schoolScopeDisplayTarget />
    </app-school-scope-selection-popover>
    <app-academic-year-popover class="mb-6 w-full">
      <app-academic-year-selection #academicYearDisplayTarget />
    </app-academic-year-popover>

    <nav class="grid w-full grid-cols-2 gap-2 bg-inherit p-0">
      @for (menuRoute of menuRoutes(); track menuRoute.path) {
      <app-mobile-menu-item [menuRoute]="menuRoute" />
      }
    </nav>
  </div>
</ion-content>
