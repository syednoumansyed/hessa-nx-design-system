<div class="flex gap-1">
  <div class="rounded-lg border border-gray-200 bg-white p-2">
    <div class="text-sm font-semibold capitalize text-neutral-900">
      {{ data.lecture.dayOfWeek | dayOfWeek }}
    </div>
    <div class="text-sm font-normal text-gray-500">
      {{ "enum.PERIOD" | dsTranslate }} {{ data.lecture.periodNumber }} (
      {{ data.lecture.startTime | time12hr }} -
      {{ data.lecture.endTime | time12hr }})
    </div>
  </div>
</div>
