<div class="flex gap-1">
  @for (lecture of lectures; track lecture.id) {
    <div class="rounded-lg border border-gray-200 bg-white p-2">
      <div class="text-sm font-semibold capitalize text-neutral-900">
        {{ lecture.dayOfWeek | dayOfWeek }}
      </div>
      <div class="text-sm font-normal text-gray-500">
        {{ "enum.PERIOD" | dsTranslate }} {{ lecture.periodNumber }} (
        {{ lecture.startTime | time12hr }} - {{ lecture.endTime | time12hr }})
      </div>
    </div>
  }
</div>
