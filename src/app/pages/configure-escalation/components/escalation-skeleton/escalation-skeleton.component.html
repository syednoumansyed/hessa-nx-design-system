@for (item of items(); track item) {
  <div
    class="animate-pulse items-center border border-b-0 bg-white p-8 md:mb-6 md:flex md:rounded-md md:border-x md:border-b"
  >
    <div class="flex-grow">
      <div class="mb-4 h-6 w-44 items-start rounded bg-gray-300 md:mx-0"></div>
      <div class="mb-2 flex items-start items-center md:flex-row">
        <div class="me-2 h-6 w-6 rounded-full bg-gray-300 md:mb-0"></div>
        <div class="me-2 h-4 w-32 rounded bg-gray-300 md:mb-0"></div>
        <div class="h-4 w-16 rounded bg-gray-300"></div>
      </div>
      <div class="mb-2 flex items-start items-center md:flex-row">
        <div class="me-2 h-6 w-6 rounded-full bg-gray-300 md:mb-0"></div>
        <div class="me-2 h-4 w-32 rounded bg-gray-300 md:mb-0"></div>
        <div class="h-4 w-36 rounded bg-gray-300"></div>
      </div>
    </div>
    <div
      class="mx-auto mt-4 h-8 w-full rounded bg-gray-300 md:mx-0 md:ml-4 md:mt-0 md:w-24"
    ></div>
  </div>
}
