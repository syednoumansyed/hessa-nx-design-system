<ion-content class="no-scrollbar" *transloco="let t">
  <div class="flex min-h-full flex-col">
    <!-- Sticky Level Dropdown -->
    <div class="sticky top-0 z-10 bg-brand-35 px-ds-xl pt-ds-2xl">
      <app-ds-select
        [config]="levelSelectConfig()"
        [formControl]="levelControl"
      />
    </div>

    <!-- Main Content Area -->
    <div
      class="flex flex-1 flex-col gap-ds-xl px-ds-xl pt-ds-xl"
      [ngClass]="isMobile() ? 'pb-ds-xl' : 'pb-0'"
    >
      <!-- Subject Section -->
      <div class="flex flex-1 flex-col gap-ds-md">
        <!-- Subject Label (only shown when level is selected) -->
        @if (isLevelSelected()) {
        <div class="ps-ds-md text-ds-sm font-semibold text-emphasis-high">
          {{ t("global.subject.title") }}
          <span class="pd-ds-xs text-red-500">*</span>
        </div>
        }

        <!-- Empty/Loading State Container -->
        @if (!isLevelSelected() || isLoadingSubjects() || subjects().length ===
        0) {
        <app-lo-empty-state
          [isLoading]="isLoadingSubjects()"
          [title]="!isLevelSelected() ? t('learning_outcome.no_level_selected.title') : t('learning_outcome.no_subject_found.title')"
          [description]="!isLevelSelected() ? t('learning_outcome.no_level_selected.txt') : t('learning_outcome.no_subject_found.txt')"
        />
        } @else {
        <!-- Subject Grid -->
        <div class="grid grid-cols-2 gap-ds-md sm:grid-cols-3 lg:grid-cols-4">
          @for (subject of subjects(); track subject.id) {
          <button
            type="button"
            class="flex h-[150px] flex-col items-center gap-ds-md rounded-ds-lg border-2 p-ds-md transition-all sm:h-[168px]"
            [ngClass]="selectedSubject()?.id === subject.id
              ? 'border-brand-600 bg-brand-100'
              : 'border-stroke-black-08 bg-surface-primary'"
            (click)="onSubjectSelect(subject)"
          >
            <!-- Subject Icon -->
            <img
              [src]="subject.iconUrl || 'assets/icons/subject-default.svg'"
              [alt]="subject.displayName"
              class="h-[72px] w-[72px] object-contain"
            />
            <!-- Subject Name -->
            <span
              class="content-lg-mid-emphasis line-clamp-2 text-center text-emphasis-high"
            >
              {{ subject.displayName }}
            </span>
          </button>
          }
        </div>
        }
      </div>
    </div>

    <!-- Sticky Footer with Next Button -->
    <div
      *hesRbac="listUnitsPermissionId"
      class="sticky bottom-0 bg-brand-35 p-ds-xl"
      [ngClass]="isMobile() ? 'border-t border-stroke-black-08' : 'flex justify-end'"
    >
      <ds-button
        [fullWidth]="isMobile()"
        [disabled]="isNextDisabled()"
        [title]="t('global.next.btn')"
        [cssClass]="'min-w-[10rem]'"
        (click)="onNext()"
      >
        {{ t("global.next.btn") }}
      </ds-button>
    </div>
  </div>
</ion-content>
