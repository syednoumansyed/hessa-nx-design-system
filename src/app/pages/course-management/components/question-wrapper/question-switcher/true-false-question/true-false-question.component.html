<ng-container [formGroup]="form">
  <div class="flex flex-col gap-4 md:gap-10">
    <app-form-control-generator
      [control]="questionConfig()"
    ></app-form-control-generator>
    <app-question-images-upload></app-question-images-upload>
    <div formArrayName="questionOptions" class="flex flex-col gap-4">
      @for (
        option of form.controls.questionOptions.controls;
        track option;
        let idx = $index
      ) {
        <ng-container [formGroupName]="idx">
          <app-multi-question-item
            [idx]="idx"
            [form]="option"
            [isReadonly]="true"
            class="w-full"
            (markAsCorrect)="onMarkAsCorrect(idx)"
          ></app-multi-question-item>
        </ng-container>
      }
    </div>
  </div>
</ng-container>
