<div class="hes-card mt-2 flex flex-col" *transloco="let t">
  <div class="flex items-center justify-between text-center">
    <div class="text-base font-semibold text-[#272525]">
      {{ t("attendance.extended_time.title") }}
    </div>
    <ion-button
      hesBtn
      hesSize="sm"
      hesColor="link"
      class="bg-[#FFFCE7]"
      (click)="removeException()"
    >
      {{ t("attendance.remove_exception.btn") }}
    </ion-button>
  </div>
  <div class="mt-8 flex flex-col gap-2 text-base">
    <label class="font-semibold text-[#272525]">{{
      t("global.school.title")
    }}</label>
    <div class="font-normal text-[#41434A]">{{ item.school.displayName }}</div>
  </div>
  <div class="mt-5 flex w-full text-base">
    <div class="flex flex-1 flex-col gap-2">
      <div class="font-semibold text-[#272525]">
        {{ t("attendance.end_time.title") }}
      </div>
      <div class="font-normal text-[#41434A]">{{ item.endTime | hesTime }}</div>
    </div>
    <div class="flex flex-1 flex-col gap-2">
      <div class="font-semibold text-[#272525]">
        {{ t("global.select_date.title") }}
      </div>
      <div class="font-normal text-[#41434A]">
        {{ item.startDateTime | hesDate }} - {{ item.endDateTime | hesDate }}
      </div>
    </div>
  </div>
</div>
