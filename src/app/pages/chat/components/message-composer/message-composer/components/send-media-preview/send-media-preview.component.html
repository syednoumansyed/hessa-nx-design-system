<form
  (ngSubmit)="onSend()"
  class="flex h-full flex-col overflow-hidden"
  *transloco="let t"
>
  <!-- Media Preview Section -->
  <div class="flex min-h-0 flex-1 items-center justify-center overflow-hidden">
    <app-message-media-preview
      [media]="media"
      (pdfLoadSuccess)="onPdfLoadSuccess()"
      class="h-full w-full"
    />
  </div>

  <!-- Input Section (matching message-composer design) -->
  <div class="shrink-0 border-t border-neutral-cool-200 bg-white p-3">
    <div class="flex flex-row items-center gap-ds-md">
      <textarea
        #textareaRef
        [formControl]="textInput"
        (keydown.enter)="onEnter($event)"
        (input)="adjustTextareaHeight()"
        rows="1"
        placeholder="{{ t('chats.write_message.placeholder') }}"
        class="w-full resize-none rounded-ds-lg border-none bg-pastels-neutralGray-50 text-[#797C7B]"
      ></textarea>

      <div
        class="flex h-[32px] w-[32px] flex-none shrink-0 items-center justify-center"
        [class.cursor-pointer]="!isSendDisabled()"
        [class.cursor-not-allowed]="isSendDisabled()"
        [class.opacity-40]="isSendDisabled()"
        (click)="onSend()"
      >
        @if (isLoading()) {
          <ion-spinner></ion-spinner>
        } @else {
          <app-ds-icon
            [icon]="faPaperPlaneTop"
            size="xl"
            class="rtl:rotate-180"
          />
        }
      </div>
    </div>
  </div>
</form>
