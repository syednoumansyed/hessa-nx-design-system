<div
  (click)="openFile()"
  class="pdf-card mb-1 flex h-16 w-full cursor-pointer items-center rounded-lg border px-4 py-4"
>
  <div
    class="pdf-icon flex h-8 w-8 items-center justify-center rounded-full border-4 border-[#FFFCE7] bg-[--h-color-primary-50] text-[#ECAD01]"
  >
    <app-hes-icon [faIcon]="faFile"></app-hes-icon>
  </div>
  <div class="mx-4">
    <h6 class="text-xs font-medium md:text-sm">
      {{ previewFile() }}
    </h6>
  </div>
</div>
