<div>
  <div class="customHeaderLabel">{{ params.displayName }}</div>
  <div
    *ngIf="params.enableSorting"
    (click)="onSortRequested('asc', $event)"
    [ngClass]="ascSort"
    class="customSortDownLabel"
  >
    <i class="fa fa-long-arrow-alt-down"></i>
  </div>
  <div
    *ngIf="params.enableSorting"
    (click)="onSortRequested('desc', $event)"
    [ngClass]="descSort"
    class="customSortUpLabel"
  >
    <i class="fa fa-long-arrow-alt-up"></i>
  </div>
  <div
    *ngIf="params.enableSorting"
    (click)="onSortRequested(null, $event)"
    [ngClass]="noSort"
    class="customSortRemoveLabel"
  >
    <i class="fa fa-times"></i>
  </div>
</div>

<div class="Frame42 inline-flex h-8 w-[122px] items-center justify-start gap-4">
  <div class="TableHeader flex items-center justify-start gap-1">
    <div
      class="NationalId text-sm font-bold uppercase leading-[18px] text-zinc-700"
    >
      {{ params.displayName }}
    </div>
  </div>
  <div class="Frame40 inline-flex flex-col items-start justify-start">
    <div
      class="ExpandMoreFill1Wght400Grad0Opsz48 relative h-4 w-4 origin-top-left -rotate-180"
    ></div>
    <div class="ExpandMoreFill1Wght400Grad0Opsz48 relative h-4 w-4"></div>
  </div>
</div>
