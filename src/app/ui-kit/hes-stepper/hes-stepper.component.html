@if (orientation === "vertical") {
  <section>
    <div class="flex flex-col gap-6">
      @for (step of steps; track $index) {
        <div
          [attr.data-index]="$index + 1"
          [ngClass]="{
            'selected border border-primary p-8': selectedIndex === $index,
            'py-3 pe-8 ps-5': selectedIndex !== $index,
            completed: step.completed,
            mobile: isMobile
          }"
          class="step relative flex flex-col items-center justify-start rounded-lg bg-white"
        >
          <div
            (click)="step.select()"
            [ngClass]="{ 'mb-8': selectedIndex === $index }"
            class="flex w-full cursor-pointer items-center justify-between gap-2"
          >
            <span
              class="h5 flex-shrink-0 flex-grow capitalize leading-7 text-gray-900"
            >
              {{ step.label }}
            </span>
            <span class="h-6 w-6">
              <fa-icon
                [icon]="selectedIndex === $index ? faChevronUp : faChevronDown"
              ></fa-icon>
            </span>
          </div>

          @if (selectedIndex === $index) {
            <div class="w-full">
              <ng-container *ngTemplateOutlet="step.content"></ng-container>
            </div>
          }
        </div>
      }
    </div>
  </section>
} @else {
  <div
    class="flex flex-col gap-4 py-4 pb-4"
    [ngClass]="{
      'border-b border-[#E0E0E0]': !isMobile
    }"
  >
    <div class="flex text-sm md:px-6">
      @for (step of steps; track $index; let last = $last) {
        <span
          (click)="step.select()"
          class="flex cursor-pointer font-normal text-[#000000]"
        >
          <span
            class="mr-[5px] flex h-5 w-5 items-center justify-center rounded-full border border-[#ECAD01]"
            [ngClass]="{
              'bg-[#ECAD01] text-white': step.completed,
              'bg-[#FFFCE7] text-[#ECAD01]': !step.completed
            }"
          >
            @if (step.completed) {
              <fa-icon [icon]="faCheck"></fa-icon>
            } @else {
              {{ $index + 1 }}
            }
          </span>
          {{ step.label }}
        </span>
        @if (!last) {
          <span class="mt-3 flex h-[1px] w-28 bg-[#D1D5DB]"></span>
        }
      }
    </div>
  </div>
  <div class="my-4 flex md:px-6">
    <div [ngTemplateOutlet]="selected ? selected.content : null"></div>
  </div>
}
