<ng-container>
  <div
    class="flex h-full max-h-screen flex-col items-center justify-start lg:gap-6 lg:p-6"
  >
    <div
      class="ios-header-padding flex w-full items-center justify-stretch gap-2 py-4"
    >
      <div
        class="flex-1 text-center text-lg font-semibold leading-7 text-gray-900 lg:text-2xl"
      >
        {{ title }}
      </div>
      <div
        (click)="cancel()"
        class="me-1 flex h-full items-center justify-center p-3"
      >
        <app-hes-icon
          class="flex-shrink cursor-pointer"
          [faIcon]="faXmark"
        ></app-hes-icon>
      </div>
    </div>
    <div data-vjs-player appDisableRightClick>
      <video
        #target
        id="target"
        class="video-js vjs-hessa h-full w-full"
        controls
        muted
        playsinline
        preload="none"
      ></video>
    </div>
  </div>
</ng-container>
