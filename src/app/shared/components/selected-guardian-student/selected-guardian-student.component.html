@if (fullName()) {
  <div class="hes-card mx-4 flex gap-3 px-4 py-2 md:mx-6" *transloco="let t">
    <div class="flex h-14 w-14 items-center justify-center">
      <app-ds-avatar [fullName]="fullName()" [color]="profileColor()" />
    </div>
    <div
      class="flex flex-col gap-2 text-[15px] md:w-full md:flex-row md:justify-between"
    >
      <div class="flex items-center text-xl font-normal text-[#101828]">
        {{ fullName() }}
      </div>
      <div
        class="flex flex-col gap-1 md:flex-row md:items-center md:justify-center md:gap-6"
      >
        <div class="flex gap-1">
          <label class="font-normal text-[#667085]">{{
            t("global.national_id.label")
          }}</label>
          <div class="font-medium text-[#000000]">{{ nationalId() }}</div>
        </div>
        @if (levelName()) {
          <div class="flex gap-1">
            <label class="font-normal text-[#667085]">{{
              t("global.level.label")
            }}</label>
            <div class="font-medium text-[#000000]">{{ levelName() }}</div>
          </div>
        }
        @if (className()) {
          <div class="flex gap-1">
            <label class="font-normal text-[#667085]">{{
              t("global.class.label")
            }}</label>
            <div class="font-medium text-[#000000]">{{ className() }}</div>
          </div>
        }
      </div>
    </div>
  </div>
}
