<ion-content *transloco="let t;" class="ds-page-content bottom-bar-spacing">
  <div class="flex flex-col items-center justify-start px-4 pt-4">
    @if(isPersonnelUser() && !isSchoolStructureEmpty()) {
    <div class="w-full rounded bg-brand-40 py-2">
      <app-school-selector class="w-full">
        <app-school-scope-selector
          #schoolScopeDisplayTarget
          class="w-full bg-brand-40 sm:w-52"
        ></app-school-scope-selector>
      </app-school-selector>
      <hr class="my-2 border-gray-200" />
      <ds-academic-year-selector class="w-full bg-brand-40">
        <ds-academic-year-selection
          class="w-full bg-brand-40 sm:w-auto"
        ></ds-academic-year-selection>
      </ds-academic-year-selector>
    </div>
    }

    <div class="my-4 w-full text-start">
      <div class="emphasis-high text-base font-bold">
        {{ t('my_tools.title') }}
      </div>
      <div class="emphasis-mid text-sm">{{ t('my_tools.txt') }}</div>
    </div>

    <nav class="grid w-full grid-cols-2 gap-2 pb-6">
      @for (menuRoute of menuRoutes(); track menuRoute.path) {
      <ds-mobile-menu-item
        [menuRoute]="menuRoute"
        (clickableItemClick)="onClickableItemClick($event)"
      />
      }
    </nav>
  </div>
</ion-content>
