<div class="flex max-w-screen-lg flex-col gap-1">
  <!-- label -->
  @if (label()) {
    <label [for]="id()" class="single-line-xs-mid-emphasis ps-ds-md">
      {{ label() }}
      @if (required()) {
        <span [class]="disabledSig() ? 'text-neutral-cool-300' : 'text-error'"
          >*</span
        >
      }
    </label>
  }

  <!-- textarea -->
  <textarea
    [attr.rows]="rows"
    [placeholder]="placeholder()"
    [disabled]="disabledSig()"
    [class]="textareaClasses()"
    [value]="valueSig()"
    [attr.maxlength]="maxLength ?? null"
    (input)="onInput($event)"
    (blur)="onBlur()"
  ></textarea>

  <!-- helper: left column (hintLeft)  |  right column (counter + hintRight) -->
  <div
    class="flex justify-between text-sm text-emphasis-mid"
    [ngClass]="disabledSig() ? 'text-neutral-cool-300' : ''"
  >
    <div class="flex flex-col">
      @if (hintLeft()) {
        <span class="ps-ds-md">{{ hintLeft() }}</span>
      }
    </div>

    <div class="flex flex-col items-end">
      @if (showCharacterCount()) {
        <span class="content-xs-mid-emphasis pe-ds-md text-content-mid"
          >{{ valueSig().length }}
          @if (maxLength) {
            /{{ maxLength }}
          }
        </span>
      }
      @if (hintRight()) {
        <span class="pe-ds-md text-emphasis-high">{{ hintRight() }}</span>
      }
    </div>
  </div>
</div>
