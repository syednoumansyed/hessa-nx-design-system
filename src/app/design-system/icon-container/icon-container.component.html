<div class="flex w-fit flex-col items-center justify-center">
  <div
    class="item-center relative flex h-[112px] w-[112px] justify-center rounded-[32px] border-[8px] border-stroke-black-08 bg-white p-[8px]"
  >
    <app-ds-icon
      [icon]="config().icon"
      class="h-full w-full"
      [class]="iconColorClass()"
      size="48px"
    ></app-ds-icon>

    @if (hasChip() && chipConfig(); as chip) {
      <app-ds-chip
        class="absolute bottom-[-12px]"
        [text]="chip.text"
        [variant]="chip.variant"
        [customClasses]="chip.customClasses"
        [startIcon]="chip.startIcon"
        [removable]="chip.removable"
      ></app-ds-chip>
    }

    @if (hasMenu()) {
      <ds-menu [items]="config().menu?.items || []">
        <div
          class="absolute right-[-10px] top-[-10px] flex h-[32px] w-[32px] items-center justify-center rounded-ds-full border-[1px] border-stroke-black-08 bg-icon-action p-[8px] text-center"
        >
          <span class="text-xl text-icon-high"> &#8942;</span>
        </div>
      </ds-menu>
    } @else if (hasIndicator()) {
      <img
        width="40px"
        src="../../../assets/gifs/icon-unread-circle.gif"
        class="absolute right-[-5px] top-[-5px] p-[8px]"
      />
    }
  </div>

  @if (hasLabel()) {
    <div
      class="single-line-caption-mid-emphasis mb-3 mt-3 line-clamp-1 max-w-[111px] text-center"
      [title]="config().label"
    >
      {{ config().label | dsTranslate }}
    </div>
  }
</div>
