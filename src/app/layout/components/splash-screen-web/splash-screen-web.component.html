<div
  *transloco="let t"
  class="fixed inset-0 z-[9999] flex w-full flex-col items-center justify-center bg-surface-primary"
>
  <div
    class="flex flex-col items-center justify-center gap-8 sm:gap-4 md:gap-6"
  >
    <!-- Mobile-only NX logo placed above camel (≈50px spacing) -->
    <div class="mb-12 block sm:hidden">
      <img
        [src]="`/assets/logos/nx-yellow-beta-${activeLang}.svg`"
        alt="NX Logo"
        class="h-auto w-[100px] max-w-full"
        fetchPriority="high"
      />
    </div>

    <!-- Camel character -->
    <div class="flex items-center justify-center">
      <img
        src="/assets/logos/camel-mascot.svg"
        alt="NX Camel"
        class="h-auto w-[180px] sm:w-[120px] md:w-[180px] lg:w-[268px]"
        fetchPriority="high"
      />
    </div>
  </div>

  <!-- Loading indicator at bottom (keep always). NX logo hidden on mobile, shown ≥ sm -->
  <div
    class="absolute bottom-12 flex flex-col items-center justify-center gap-3 sm:bottom-8"
  >
    <!-- Bottom NX Logo (desktop / tablet only) -->
    <div class="hidden items-center justify-center sm:flex">
      <img
        [src]="`/assets/logos/nx-yellow-beta-${activeLang}.svg`"
        alt="NX Logo"
        class="h-auto w-[100px] max-w-full md:w-[120px]"
        fetchPriority="high"
      />
    </div>
    <!-- Progress bar always visible -->
    <div class="h-1 w-[200px] overflow-hidden rounded-sm bg-gray-200">
      <div class="progress-bar">
        <div class="progress-bar-value"></div>
      </div>
    </div>
  </div>
</div>
